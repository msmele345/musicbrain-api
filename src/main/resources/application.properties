spring.application.name=musicbrain-api
server.port=8080

# CORS — allow Vue dev server
app.cors.allowed-origins=http://localhost:5173

# Last.fm credentials (set via env vars — never hard-code)
lastfm.api.key=${LASTFM_API_KEY}
lastfm.username=msmele35

# Caffeine cache: 500 entries, expire after 1 hour
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=1h
